// ISO week helpers (drive the weekly quote + per-week meal log)
function isoWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate()-day+3);
  const firstThu = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const fday = (firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-fday+3);
  return 1 + Math.round((date-firstThu)/(7*24*3600*1000));
}
const weekKey = (d) => d.getFullYear()+'-W'+String(isoWeek(d)).padStart(2,'0');

// calorie & macro targets DERIVED from current bodyweight — change weight and these cascade
const PROFILE = { height:191, age:28, activity:1.55, surplus:300 };
function computeTargets(kg){
  const w = Number(kg)||93;
  const bmr = 10*w + 6.25*PROFILE.height - 5*PROFILE.age + 5;
  const kcal = Math.round((bmr*PROFILE.activity + PROFILE.surplus)/10)*10;
  const protein = Math.round(2*w);
  const fat = Math.round(0.8*w);
  const carbs = Math.round((kcal - protein*4 - fat*9)/4);
  return { kcal, protein, carbs, fat, surplus:PROFILE.surplus };
}

/* ----------------------------- Derived calcs ----------------------------- */
const setVolume = (s) => (Number(s.w)||0) * (Number(s.r)||0);

function computePRs(workouts) {
  // best (max weight, then reps) per exercise
  const prs = {};
  workouts.forEach(w => {
    w.exercises.forEach(ex => {
      ex.sets.forEach(s => {
        const w_ = Number(s.w)||0, r_ = Number(s.r)||0;
        if (r_ <= 0) return;
        const cur = prs[ex.name];
        if (!cur || w_ > cur.w || (w_ === cur.w && r_ > cur.r)) {
          prs[ex.name] = { w:w_, r:r_, date:w.date, muscle:ex.muscle };
        }
      });
    });
  });
  return prs;
}

// which exercises in a given session set a new PR (vs all sessions strictly before it)
function sessionPRs(workouts, sessionIdx) {
  const session = workouts[sessionIdx];
  const prior = workouts.filter((_, i) => i !== sessionIdx && workouts[i].date < session.date);
  const priorBest = {};
  prior.forEach(w => w.exercises.forEach(ex => ex.sets.forEach(s => {
    const w_=Number(s.w)||0; priorBest[ex.name] = Math.max(priorBest[ex.name]||0, w_);
  })));
  const hits = [];
  session.exercises.forEach(ex => {
    const best = Math.max(0, ...ex.sets.map(s => Number(s.w)||0));
    if (best > (priorBest[ex.name]||0) && best > 0) hits.push(ex.name);
  });
  return hits;
}

function computeStreak(workouts) {
  const days = new Set(workouts.map(w => w.date));
  let streak = 0;
  let d = new Date();
  // allow today to be a rest day: start from today, count back consecutive workout days
  // streak = consecutive days (ending today or yesterday) with a workout
  if (!days.has(todayISO())) {
    // if no workout today, streak still counts up to yesterday
    d.setDate(d.getDate()-1);
  }
  for (let i=0;i<400;i++){
    const iso = d.toISOString().slice(0,10);
    if (days.has(iso)) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function startOfWeek(date) {
  const d = new Date(date); const day = (d.getDay()+6)%7; // Mon=0
  d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d;
}
function thisWeekCount(workouts) {
  const start = startOfWeek(new Date());
  return workouts.filter(w => new Date(w.date+'T00:00:00') >= start).length;
}
function weeklyVolumeByMuscle(workouts) {
  const start = startOfWeek(new Date());
  const recent = workouts.filter(w => new Date(w.date+'T00:00:00') >= start);
  const use = recent.length ? recent : workouts; // fall back to all-time if nothing this week
  const vol = {};
  use.forEach(w => w.exercises.forEach(ex => ex.sets.forEach(s => {
    vol[ex.muscle] = (vol[ex.muscle]||0) + setVolume(s);
  })));
  return { vol, fellBack: recent.length===0 && workouts.length>0 };
}
function exerciseTrend(workouts, name) {
  // top set weight per session over time
  const pts = [];
  [...workouts].sort((a,b)=>a.date<b.date?-1:1).forEach(w => {
    const ex = w.exercises.find(e => e.name===name);
    if (ex) { const top = Math.max(0,...ex.sets.map(s=>Number(s.w)||0)); pts.push({ date:w.date, w:top }); }
  });
  return pts;
}
const fmtDur = (sec) => {
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
};

/* ----------------------------- Workout logger ----------------------------- */
const WARMUP = ['5 min easy cardio (bike / brisk walk)','Arm circles × 15 each way','Leg swings × 10 per leg','Bodyweight squats × 15','Band pull-aparts × 20'];
const COOLDOWN = ['Chest doorway stretch · 30s/side','Lat hang / overhead reach · 30s','Hip flexor stretch · 30s/side','Hamstring stretch · 30s/side','3 min slow breathing'];

function lastSession(workouts, exName) {
  const sorted = [...workouts].sort((a,b)=>a.date<b.date?1:-1);
  for (const w of sorted){ const ex = w.exercises.find(e=>e.name===exName); if (ex) return ex.sets; }
  return null;
}

function WorkoutScreen({ active, setActive, workouts, onFinish, onDiscard }) {

  const [coolDone, setCoolDone] = useState({});

  useEffect(()=>{
    if (!active) return;
    const t = setInterval(()=> setElapsed(Math.floor((Date.now()-active.startTime)/1000)), 1000);
    return ()=>clearInterval(t);
  }, [active]);

  if (!active) return (
    <div className="flex flex-col items-center justify-center text-center py-24 px-6">

  const totalSets = active.exercises.reduce((n,e)=>n+e.sets.length,0);

function Sparkline({ name, pts, pr }) {
  const W=240, H=56, pad=6;
  const ws = pts.map(p=>p.w);
  const min = Math.min(...ws), max = Math.max(...ws);
  const range = max-min || 1;
  const stepX = pts.length>1 ? (W-pad*2)/(pts.length-1) : 0;
  const coords = pts.map((p,i)=>{
    const x = pad + i*stepX;
    const y = H-pad - ((p.w-min)/range)*(H-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area = path + ` L ${coords[coords.length-1][0].toFixed(1)} ${H-pad} L ${coords[0][0].toFixed(1)} ${H-pad} Z`;
  const c = MUSCLE_COLORS[pr?.muscle]||'#1d9bf0';
  const up = pts.length>1 && pts[pts.length-1].w >= pts[0].w;
  return (
    <div className="bg-card border border-line rounded-2xl p-4">
      <div className="flex items-start justify-between mb-2">
        <div className="font-600 text-sm leading-tight pr-2">{name}</div>
        <div className="text-right shrink-0">
          <div className="font-display text-2xl font-800" style={{color:c}}>{pr?.w}<span className="text-xs text-slate-400">kg</span></div>
          <div className="text-[10px] uppercase tracking-widest text-slate-500 font-display">PR · ×{pr?.r}</div>
        </div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height:H}}>
        <defs>
          <linearGradient id={`g-${name.replace(/\W/g,'')}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={c} stopOpacity="0.35"/>
            <stop offset="100%" stopColor={c} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={area} fill={`url(#g-${name.replace(/\W/g,'')})`} />
        <path d={path} fill="none" stroke={c} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {coords.map((co,i)=><circle key={i} cx={co[0]} cy={co[1]} r="2.5" fill={c}/>)}
      </svg>
      <div className="flex justify-between text-[10px] text-slate-500 mt-1">
        <span>{fmtDate(pts[0].date)}</span>
        <span className={up?'text-emerald-400':'text-slate-500'}>{up?'▲ trending up':'—'}</span>
        <span>{fmtDate(pts[pts.length-1].date)}</span>
      </div>
    </div>
  );
}

      </div>

      {/* compact targets strip (derived from current weight) */}
      <div className="flex items-center gap-3 bg-gradient-to-br from-card to-panel border border-line rounded-xl px-4 py-2.5 glow">
        <div className="font-display text-2xl font-900 leading-none">{t.kcal.toLocaleString()}<span className="text-xs text-slate-400 font-700"> kcal</span></div>
        <div className="ml-auto flex gap-4 text-right">
          <div><div className="font-display text-base font-800 text-electric2 leading-none">{t.protein}g</div><div className="text-[8px] uppercase tracking-widest text-slate-500 font-display mt-0.5">protein</div></div>
          <div><div className="font-display text-base font-800 text-emerald-400 leading-none">{t.carbs}g</div><div className="text-[8px] uppercase tracking-widest text-slate-500 font-display mt-0.5">carbs</div></div>
          <div><div className="font-display text-base font-800 text-yellow-400 leading-none">{t.fat}g</div><div className="text-[8px] uppercase tracking-widest text-slate-500 font-display mt-0.5">fat</div></div>
        </div>
      </div>

      {/* compact week — whole week visible, tap chips to log */}
      <div className="space-y-1.5">
        {MEALS.map((d,i)=>{
          const fc = FOCUS_COLOR[d.focus] || '#64748b';
          const total = d.meals.reduce((a,m)=>a+m.kcal,0);
          const dayLog = log[i] || {};
          const open = openDay===i;
          const isToday = i===todayIdx;
          return (
            <div key={d.day} className="bg-card border border-line rounded-xl overflow-hidden" style={{borderLeft:`3px solid ${fc}`}}>
              <div className="flex items-center gap-2 px-3 py-2">
                <button onClick={()=>setOpenDay(open?-1:i)} className="flex items-center gap-2 flex-1 min-w-0 text-left">
                  <span className="font-display text-lg font-800 w-8">{d.day}</span>
                  <span className="text-[9px] font-display uppercase tracking-wider px-1.5 py-0.5 rounded whitespace-nowrap" style={{color:fc,background:`${fc}1f`}}>{d.focus}</span>
                  {isToday && <span className="text-[8px] font-display uppercase tracking-widest text-electric2 whitespace-nowrap">• today</span>}
                  <span className="ml-auto text-[10px] text-slate-500 tabular-nums whitespace-nowrap">{total.toLocaleString()}</span>
                </button>
                <div className="flex gap-1">
                  {slots.map(s=>{
                    const on = !!dayLog[s];
                    return (
                      <button key={s} onClick={()=>onToggleMeal(wk,i,s)} title={s}
                        className={`w-6 h-6 rounded-md flex items-center justify-center font-display text-[11px] font-800 transition active:scale-90 ${on?'bg-emerald-500 text-white':'bg-ink text-slate-500 border border-line'}`}>
                        {on?'✓':s[0]}
                      </button>
                    );
                  })}
                </div>
              </div>
              {open && (
                <div className="px-3 pb-2.5 space-y-1.5">
                  {d.meals.map((m,k)=>{
                    const meta = SLOT_META[m.slot];
                    const on = !!dayLog[m.slot];
                    return (
                      <button key={k} onClick={()=>onToggleMeal(wk,i,m.slot)}
                        className={`w-full text-left rounded-lg px-3 py-2 border transition ${on?'bg-emerald-500/10 border-emerald-500/30':'bg-ink border-line'}`}>
                        <div className="flex items-center justify-between">
                          <span className="font-display tracking-widest text-[9px] uppercase" style={{color:meta.color}}>{meta.icon} {m.slot}</span>
                          <div className="flex gap-1 items-center">
                            <span className="text-[9px] font-700 font-display px-1.5 py-0.5 rounded bg-white/5 text-slate-300">{m.kcal}</span>
                            <span className="text-[9px] font-700 font-display px-1.5 py-0.5 rounded" style={{color:'#37c0ff',background:'#1d9bf01f'}}>{m.p}g P</span>
                            {on && <span className="text-emerald-400 text-xs">✓</span>}
                          </div>
                        </div>
                        <div className="font-600 text-sm mt-0.5">{m.name}</div>
                        <div className="text-[11px] text-slate-400 leading-snug">{m.desc}</div>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="text-[10px] text-slate-500 text-center">Tap B / L / S / D to tick off each meal · resets every week · full list in Shop tab</div>
    </div>
  );
}

/* ----------------------------- Grocery (Shop tab) ----------------------------- */
function Grocery({ checked, qty, onToggle, onQty, onReset }) {
  const allItems = GROCERY.flatMap(s=>s.items.map(it=>slug(it.n)));
  const doneCount = allItems.filter(id=>checked[id]).length;
  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between">
        <h1 className="font-display text-3xl font-800">SHOP</h1>
        <button onClick={onReset} className="text-[10px] font-display uppercase tracking-widest text-slate-400 border border-line rounded-lg px-3 py-1.5 active:scale-95">Reset</button>
      </div>

      <div className="flex items-center gap-3 bg-gradient-to-br from-card to-panel border border-line rounded-xl px-4 py-3 glow">
        <div>
          <div className="font-display text-2xl font-900 leading-none">{doneCount}<span className="text-slate-400 text-lg">/{allItems.length}</span></div>
          <div className="text-[9px] uppercase tracking-widest text-slate-500 font-display mt-0.5">items in basket</div>
        </div>
        <div className="ml-auto text-right">
          <div className="font-display text-2xl font-900 text-emerald-400 leading-none">≈ €110</div>
          <div className="text-[9px] uppercase tracking-widest text-slate-500 font-display mt-0.5">budget €100–120</div>
        </div>
      </div>

      {GROCERY.map(sec=>(
        <div key={sec.section} className="bg-card border border-line rounded-xl p-3">
          <div className="font-display text-sm font-800 tracking-wider uppercase text-slate-300 mb-2">{sec.icon} {sec.section}</div>
          <div className="space-y-1">
            {sec.items.map(it=>{
              const id = slug(it.n);
              const on = !!checked[id];
              const q = qty[id] !== undefined ? qty[id] : it.q;
              return (
                <div key={id} className="flex items-center gap-2.5">
                  <button onClick={()=>onToggle(id)}
                    className={`w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition active:scale-90 ${on?'bg-emerald-500 border-emerald-400':'bg-ink border-line'}`}>
                    {on && <svg viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="white" strokeWidth="3"><path d="M5 13l4 4L19 7" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                  </button>
                  <span className={`flex-1 text-sm ${on?'text-slate-500 line-through':'text-slate-200'}`}>{it.n}</span>
                  <input value={q} onChange={e=>onQty(id, e.target.value)}
                    className="w-20 bg-ink border border-line focus:border-electric rounded-lg px-2 py-1 text-center text-[12px] text-slate-300 outline-none" />
                </div>
              );
            })}
          </div>
        </div>
      ))}

      <div className="text-[11px] text-slate-500 leading-relaxed bg-card border border-line rounded-xl p-3">
        Quantities cover the full 7-day plan for one person. Adjust any amount inline — quick-prep tip: batch-cook rice, pasta and chicken on Sunday, and lean on tinned tuna, eggs and skyr for no-cook meals.
      </div>
    </div>
  );
}

/* ----------------------------- Bottom nav ----------------------------- */
function Nav({ tab, setTab, activeBadge }) {
  const items = [
    { id:'dashboard', label:'Home', icon:'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10' },
    { id:'workout', label:'Workout', icon:'M6.5 6.5l11 11M4 8l-1 1 3 3M20 16l1-1-3-3M8 4l-1 1 3 3M16 20l1-1-3-3' },
    { id:'meals', label:'Meals', icon:'M5 3v8M8 3v8M6.5 11v10M17 3c-1.7 0-2.5 2-2.5 5s.8 4 2.5 4v9' },
    { id:'shop', label:'Shop', icon:'M3 3h2l1.6 11.2a1 1 0 001 .8h9.7a1 1 0 001-.8L21 7H6M9 21a1 1 0 100-2 1 1 0 000 2zM18 21a1 1 0 100-2 1 1 0 000 2z' },
    { id:'history', label:'History', icon:'M12 8v5l3 2M3 12a9 9 0 1018 0 9 9 0 00-18 0' },
    { id:'progress', label:'Progress', icon:'M4 19V5M4 19h16M8 16l3-4 3 2 4-6' },
  ];
  return (
    <div className="fixed bottom-0 inset-x-0 z-30 bg-panel/95 backdrop-blur border-t border-line">
      <div className="max-w-xl mx-auto grid grid-cols-6">
        {items.map(it=>{
          const on = tab===it.id;
          return (
            <button key={it.id} onClick={()=>setTab(it.id)}
              className="relative py-2.5 flex flex-col items-center gap-1">
              <svg viewBox="0 0 24 24" className="w-6 h-6" fill="none"
                stroke={on?'#37c0ff':'#64748b'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d={it.icon}/>
              </svg>
              <span className="font-display tracking-widest text-[10px] uppercase" style={{color:on?'#37c0ff':'#64748b'}}>{it.label}</span>
              {it.id==='workout' && activeBadge && <span className="absolute top-1.5 right-1/4 w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ----------------------------- App ----------------------------- */
function App() {
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState('dashboard');
  const [active, setActive] = useState(null);

  useEffect(()=>{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }, [state]);

  const prs = useMemo(()=>computePRs(state.workouts), [state.workouts]);

  const startWorkout = (day) => {
    setActive({
      planId: day.id, name: day.name, date: todayISO(), startTime: Date.now(),
      exercises: day.exercises.map(e=>({
        name:e.name, muscle:e.muscle,
        sets: Array.from({length:e.sets}, ()=>({ w:'', r:'', done:false }))
      }))
    });
    setTab('workout');
  };

  const finishWorkout = (elapsed) => {
    const cleaned = active.exercises
      .map(e=>({ name:e.name, muscle:e.muscle, sets:e.sets.filter(s=>(Number(s.r)||0)>0).map(s=>({w:Number(s.w)||0, r:Number(s.r)||0})) }))
      .filter(e=>e.sets.length>0);
    if (cleaned.length===0) { setActive(null); setTab('dashboard'); return; }
    const newWorkout = { id:Date.now(), planId:active.planId, name:active.name, date:active.date, durationSec:elapsed, exercises:cleaned };
    setState(s=>({ ...s, workouts:[...s.workouts, newWorkout] }));
    setActive(null);
    setTab('history');
  };

  const discardWorkout = () => { setActive(null); setTab('dashboard'); };

  const toggleMeal = (wk, di, slot) => setState(s=>{
    const ml = { ...(s.mealLog||{}) };
    const week = { ...(ml[wk]||{}) };
    const day = { ...(week[di]||{}) };
    day[slot] = !day[slot];
    week[di] = day; ml[wk] = week;
    return { ...s, mealLog:ml };
  });
  const toggleGrocery = (id) => setState(s=>({ ...s, groceryChecked:{ ...(s.groceryChecked||{}), [id]: !(s.groceryChecked||{})[id] } }));
  const setGroceryQty = (id, val) => setState(s=>({ ...s, groceryQty:{ ...(s.groceryQty||{}), [id]: val } }));
  const resetGrocery = () => setState(s=>({ ...s, groceryChecked:{} }));

  return (
    <div className="min-h-screen text-slate-100 max-w-xl mx-auto px-4 pt-5 pb-28">
      {tab==='dashboard' && <Dashboard workouts={state.workouts} prs={prs} profile={state.profile}
        setProfile={(p)=>setState(s=>({...s, profile:p}))} onStart={startWorkout} />}
      {tab==='workout' && <WorkoutScreen active={active} setActive={setActive} workouts={state.workouts}
        onFinish={finishWorkout} onDiscard={discardWorkout} />}
      {tab==='meals' && <Meals profile={state.profile} mealLog={state.mealLog||{}} onToggleMeal={toggleMeal} />}
      {tab==='shop' && <Grocery checked={state.groceryChecked||{}} qty={state.groceryQty||{}} onToggle={toggleGrocery} onQty={setGroceryQty} onReset={resetGrocery} />}
      {tab==='history' && <History workouts={state.workouts} />}
      {tab==='progress' && <Progress workouts={state.workouts} prs={prs} />}
      <Nav tab={tab} setTab={setTab} activeBadge={!!active} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
