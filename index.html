  const w = Number(kg)||93;
  const bmr = 10*w + 6.25*PROFILE.height - 5*PROFILE.age + 5;

}

const setVolume = (s) => (Number(s.w)||0)*(Number(s.r)||0);

function sessionPRs(workouts, idx){ const session=workouts[idx]; const prior=workouts.filter((_,i)=>i!==idx&&workouts[i].date<session.date); const pb={}; prior.forEach(w=>w.exercises.forEach(ex=>ex.sets.forEach(s=>{ pb[ex.name]=Math.max(pb[ex.name]||0,Number(s.w)||0); }))); const hits=[]; session.exercises.forEach(ex=>{ const best=Math.max(0,...ex.sets.map(s=>Number(s.w)||0)); if(best>(pb[ex.name]||0)&&best>0) hits.push(ex.name); }); return hits; }

function weeklyVolumeByMuscle(workouts){ const start=startOfWeek(new Date()); const recent=workouts.filter(w=>new Date(w.date+'T00:00:00')>=start); const use=recent.length?recent:workouts; const vol={}; use.forEach(w=>w.exercises.forEach(ex=>ex.sets.forEach(s=>{ vol[ex.muscle]=(vol[ex.muscle]||0)+setVolume(s); }))); return { vol, fellBack:recent.length===0&&workouts.length>0 }; }

function navyBodyFat({waist, neck, height}){
  const W=Number(waist)||0, N=Number(neck)||0, H=Number(height)||0;
  if (W<=N || W<=0 || N<=0 || H<=0) return null;
  const bf = 495/(1.0324 - 0.19077*Math.log10(W-N) + 0.15456*Math.log10(H)) - 450;
  if (!isFinite(bf) || bf<=0 || bf>60) return null;
  return Math.round(bf*10)/10;
}

/* goal progress */
function goalProgress(goal, state){
  const today = todayISO();
  if (goal.auto==='gym') return { value: thisWeekCount(state.workouts), target: goal.target, period:'deze week' };
  if (goal.cadence==='daily'){ const v=(state.dayLog[today]||{})[goal.id]; const value=goal.metric==='count'?(v?1:0):(Number(v)||0); return { value, target:goal.target, period:'vandaag' }; }
  if (goal.cadence==='weekly'){ const ws=startOfWeek(new Date()); let c=0; Object.entries(state.dayLog).forEach(([d,obj])=>{ if(new Date(d+'T00:00:00')>=ws && obj[goal.id]) c++; }); return { value:c, target:goal.target, period:'deze week' }; }
  if (goal.cadence==='monthly'){ const v=(state.monthLog[monthKey(today)]||{})[goal.id]; return { value:Number(v)||0, target:goal.target, period:'deze maand' }; }
  return { value:0, target:goal.target, period:'' };
}
const goalColor = (goal) => goal.color || AREAS[goal.area]?.color || '#3F9FE0';

/* clean + lifestyle */
function isDayClean(state, date){ const c=(state.dayLog[date]||{}).clean; return !!(c && c.smoke && c.energy && c.focus); }
function isFreeDay(state, date){ return !!(state.dayLog[date]||{}).freeDay; }
function weekFreeCount(state, refDate){ const ws=startOfWeek(refDate||new Date()); let c=0; Object.entries(state.dayLog||{}).forEach(([d,o])=>{ if(o.freeDay && new Date(d+'T00:00:00')>=ws) c++; }); return c; }
function cleanStreak(state){ let d=new Date(); if(!isDayClean(state,todayISO())) d.setDate(d.getDate()-1); let n=0; for(let i=0;i<1000;i++){ const iso=d.toISOString().slice(0,10); if(isDayClean(state,iso)){ n++; d.setDate(d.getDate()-1);} else break; } return n; }
function dailyGoalsList(state){ return state.goals.filter(g=>g.cadence==='daily'); }
function dailyGoalMetOn(goal, state, date){ const day=state.dayLog[date]||{}; if(goal.metric==='count') return !!day[goal.id]; return (Number(day[goal.id])||0) >= goal.target; }
function isDayPerfect(state, date){ if(isFreeDay(state,date)) return false; const dg=dailyGoalsList(state); if(!dg.length) return false; if(!dg.every(g=>dailyGoalMetOn(g,state,date))) return false; return isDayClean(state,date); }
function lifestyleStreak(state){ let d=new Date(); const t=todayISO(); if(!isDayPerfect(state,t) && !isFreeDay(state,t)) d.setDate(d.getDate()-1); let n=0; for(let i=0;i<1000;i++){ const iso=d.toISOString().slice(0,10); if(isDayPerfect(state,iso)){ n++; d.setDate(d.getDate()-1); } else if(isFreeDay(state,iso)){ d.setDate(d.getDate()-1); } else break; } return n; }
function todayLifestyle(state){ const t=todayISO(); const dg=dailyGoalsList(state); const reqs=dg.map(g=>dailyGoalMetOn(g,state,t)).concat([isDayClean(state,t)]); const met=reqs.filter(Boolean).length; return { met, total:reqs.length, perfect:met===reqs.length && reqs.length>0, free:isFreeDay(state,t) }; }
function dayConsistency(state, date){ const dg=dailyGoalsList(state); if(!dg.length) return 0; const day=state.dayLog[date]||{}; const ps=dg.map(g=>{ const v=g.metric==='count'?(day[g.id]?1:0):(Number(day[g.id])||0); return Math.min(1, g.target? v/g.target:0); }); return ps.reduce((a,b)=>a+b,0)/ps.length; }
function weekConsistency(state, weekStart){ const t=todayISO(); let sum=0,n=0; for(let i=0;i<7;i++){ const d=new Date(weekStart); d.setDate(d.getDate()+i); const iso=d.toISOString().slice(0,10); if(iso>t) break; sum+=dayConsistency(state,iso); n++; } return n? sum/n : 0; }
function listWeeks(state){ const cur=startOfWeek(new Date()); const keys=Object.keys(state.dayLog||{}).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort(); const earliest=keys.length? startOfWeek(new Date(keys[0]+'T00:00:00')) : cur; const out=[]; let w=new Date(cur); for(let i=0;i<53;i++){ out.push(new Date(w)); if(w.getTime()<=earliest.getTime()) break; w.setDate(w.getDate()-7); } return out; }
function last7Clean(state){ const out=[]; for(let i=6;i>=0;i--){ out.push(isDayClean(state,daysAgoISO(i))); } return out; }
function last7Perfect(state){ const out=[]; for(let i=6;i>=0;i--){ const iso=daysAgoISO(i); out.push(isDayPerfect(state,iso)||isFreeDay(state,iso)); } return out; }

function Ring({ pct, size=92, stroke=9, color='#CDFF47', track='rgba(255,255,255,.07)', animate=true, children }){
  const [p,setP]=useState(animate?0:pct);
  useEffect(()=>{ const t=setTimeout(()=>setP(pct),60); return ()=>clearTimeout(t); },[pct]);
  const r=(size-stroke)/2, c=2*Math.PI*r; const off=c*(1-Math.min(1,Math.max(0,p||0)));
  return (
    <div className="relative" style={{width:size,height:size}}>
      <svg width={size} height={size} className="block" style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={stroke}/>
        <circle className="ring-fg" cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off}/>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center text-center">{children}</div>
    </div>
  );
}
function Gauge({ pct, color='#CDFF47', children }){
  const ticks = Array.from({length:60},(_,i)=>{ const a=(i/60)*Math.PI*2 - Math.PI/2; const major=i%5===0; const r1=major?96:93, r2=88; return { x1:100+Math.cos(a)*r1, y1:100+Math.sin(a)*r1, x2:100+Math.cos(a)*r2, y2:100+Math.sin(a)*r2, major }; });
  const [p,setP]=useState(0); useEffect(()=>{ const t=setTimeout(()=>setP(pct),80); return ()=>clearTimeout(t); },[pct]);
  const r=77, c=2*Math.PI*r, off=c*(1-Math.min(1,Math.max(0,p||0)));
  return (
    <div className="relative" style={{width:256,height:256}}>
      <svg width="256" height="256" viewBox="0 0 200 200">
        {ticks.map((t,i)=><line key={i} x1={t.x1.toFixed(1)} y1={t.y1.toFixed(1)} x2={t.x2.toFixed(1)} y2={t.y2.toFixed(1)} stroke={t.major?'rgba(255,255,255,.22)':'rgba(255,255,255,.09)'} strokeWidth={t.major?1.6:1}/>)}
        <g style={{transform:'rotate(-90deg)',transformOrigin:'center'}}>
          <circle cx="100" cy="100" r={r} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth="13"/>
          <circle className="ring-fg" cx="100" cy="100" r={r} fill="none" stroke={color} strokeWidth="13" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} style={{filter:`drop-shadow(0 0 6px ${color}66)`}}/>
        </g>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center text-center">{children}</div>
    </div>
  );
}

function WeightSpark({ pts }){
  const W=300,H=70,pad=8; const ws=pts.map(p=>p.w); const min=Math.min(...ws),max=Math.max(...ws); const range=max-min||1; const stepX=pts.length>1?(W-pad*2)/(pts.length-1):0;
  const coords=pts.map((p,i)=>[pad+i*stepX, H-pad-((p.w-min)/range)*(H-pad*2)]);
  const path=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');

        <path d={area} fill="url(#wg)"/><path d={path} fill="none" stroke="#3F9FE0" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {coords.map((c,i)=><circle key={i} cx={c[0]} cy={c[1]} r="2.5" fill="#3F9FE0"/>)}

  );
}

function Sparkline({ name, pts, pr }){

    </div>

}

          try { const remote=mergeState(loadState(), JSON.parse(snap.data().payload)); applyingRemote.current=true; setState(remote); } catch(e){}
          setSync('synced');
        } else { docRef.current.set({ payload:JSON.stringify(stateRef.current), updated:Date.now() }).catch(()=>{}); setSync('synced'); }
      },(err)=>{ console.warn('sync error',err); setSync('offline'); });
      return ()=>unsub();
    } catch(e){ setSync('offline'); }
  },[]);
  useEffect(()=>{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    if (applyingRemote.current){ applyingRemote.current=false; return; }
    if (docRef.current) docRef.current.set({ payload:JSON.stringify(state), updated:Date.now() }).catch(()=>{});
  },[state]);

  const addGoal=(g)=>setState(s=>({ ...s, goals:[...s.goals, g] }));
  const deleteGoal=(id)=>setState(s=>({ ...s, goals:s.goals.filter(g=>g.id!==id) }));
  const setDayValue=(goalId,val)=>setState(s=>{ const d=todayISO(); const dl={...(s.dayLog||{})}; const day={...(dl[d]||{})}; day[goalId]=val; dl[d]=day; return {...s,dayLog:dl}; });
  const toggleDay=(goalId)=>setState(s=>{ const d=todayISO(); const dl={...(s.dayLog||{})}; const day={...(dl[d]||{})}; day[goalId]=!day[goalId]; dl[d]=day; return {...s,dayLog:dl}; });
  const toggleClean=(key)=>setState(s=>{ const d=todayISO(); const dl={...(s.dayLog||{})}; const day={...(dl[d]||{})}; const clean={...(day.clean||{})}; clean[key]=!clean[key]; day.clean=clean; dl[d]=day; return {...s,dayLog:dl}; });
  const toggleFreeDay=()=>setState(s=>{ const d=todayISO(); const cur=isFreeDay(s,d); if(!cur && weekFreeCount(s)>=FREE_DAYS_PER_WEEK) return s; const dl={...(s.dayLog||{})}; const day={...(dl[d]||{})}; day.freeDay=!cur; dl[d]=day; return {...s,dayLog:dl}; });
  const addWater=(amount)=>setState(s=>{ const d=todayISO(); const dl={...(s.dayLog||{})}; const day={...(dl[d]||{})}; const cur=Number(day.water)||0; day.water=Math.max(0, Math.round((cur+amount)*100)/100); dl[d]=day; return {...s,dayLog:dl}; });
  const addMonth=(goalId,amount)=>setState(s=>{ const mk=monthKey(todayISO()); const ml={...(s.monthLog||{})}; const mo={...(ml[mk]||{})}; mo[goalId]=(Number(mo[goalId])||0)+amount; ml[mk]=mo; return {...s,monthLog:ml}; });
  const saveMetric=(date,key,val)=>setState(s=>{ const me={...(s.metrics||{})}; const e={...(me[date]||{})}; e[key]=val; me[date]=e; const np = key==='weight' && val!=='' ? {...s.profile, current:Number(val)} : s.profile; return {...s,metrics:me,profile:np}; });
  const setMood=(date,key,val)=>setState(s=>{ const me={...(s.metrics||{})}; const e={...(me[date]||{})}; e[key]=val; me[date]=e; return {...s,metrics:me}; });
  const startWorkout=(day)=>{ setActive({ planId:day.id, name:day.name, date:todayISO(), startTime:Date.now(), exercises:day.exercises.map(e=>({ name:e.name, muscle:e.muscle, sets:Array.from({length:e.sets},()=>({w:'',r:'',done:false})) })) }); };
  const finishWorkout=(elapsed)=>{ const cleaned=active.exercises.map(e=>({name:e.name,muscle:e.muscle,sets:e.sets.filter(s=>(Number(s.r)||0)>0).map(s=>({w:Number(s.w)||0,r:Number(s.r)||0}))})).filter(e=>e.sets.length>0); if(cleaned.length===0){ setActive(null); return; } const nw={ id:Date.now(), planId:active.planId, name:active.name, date:active.date, durationSec:elapsed, exercises:cleaned }; setState(s=>({...s,workouts:[...s.workouts,nw]})); setActive(null); };
  const discardWorkout=()=>setActive(null);
  const toggleMeal=(wk,di,slot)=>setState(s=>{ const ml={...(s.mealLog||{})}; const week={...(ml[wk]||{})}; const day={...(week[di]||{})}; day[slot]=!day[slot]; week[di]=day; ml[wk]=week; return {...s,mealLog:ml}; });
  const toggleGrocery=(id)=>setState(s=>({...s,groceryChecked:{...(s.groceryChecked||{}),[id]:!(s.groceryChecked||{})[id]}}));
  const setGroceryQty=(id,val)=>setState(s=>({...s,groceryQty:{...(s.groceryQty||{}),[id]:val}}));
  const resetGrocery=()=>setState(s=>({...s,groceryChecked:{}}));

  const syncStyle = sync==='synced'?{color:'#CDFF47',background:'rgba(205,255,71,.1)',borderColor:'rgba(205,255,71,.3)'}:sync==='offline'?{color:'#E07A36',background:'rgba(224,122,54,.1)',borderColor:'rgba(224,122,54,.3)'}:{color:'#3F9FE0',background:'rgba(63,159,224,.1)',borderColor:'rgba(63,159,224,.3)'};
  return (
    <div className="min-h-screen text-txt max-w-md mx-auto px-4 pt-5 pb-28" style={{background:'radial-gradient(120% 60% at 50% -5%, #14171d 0%, #08090b 55%)'}}>
      <div className="fixed top-2 right-2 z-50 font-mono text-[8px] uppercase tracking-widest px-2 py-1 rounded-full border" style={syncStyle}>{sync==='synced'?'● synced':sync==='offline'?'● offline':'● sync'}</div>
      {tab==='doelen' && <GoalsScreen state={state} onAddGoal={addGoal} onDeleteGoal={deleteGoal} goTo={setTab}/>}
      {tab==='vandaag' && <TodayScreen state={state} setDayValue={setDayValue} toggleDay={toggleDay} addMonth={addMonth} toggleClean={toggleClean} toggleFreeDay={toggleFreeDay} addWater={addWater} goTo={setTab}/>}
      {tab==='weken' && <WeeksScreen state={state}/>}
      {tab==='lichaam' && <BodyScreen state={state} saveMetric={saveMetric} setMood={setMood}/>}
      {tab==='fitness' && <FitnessModule state={state} setState={setState} active={active} setActive={setActive} startWorkout={startWorkout} finishWorkout={finishWorkout} discardWorkout={discardWorkout} toggleMeal={toggleMeal} toggleGrocery={toggleGrocery} setGroceryQty={setGroceryQty} resetGrocery={resetGrocery}/>}
      <Nav tab={tab} setTab={setTab} activeBadge={!!active}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment><div id="grain"></div><App/></React.Fragment>);
</script>
</body>
</html>
